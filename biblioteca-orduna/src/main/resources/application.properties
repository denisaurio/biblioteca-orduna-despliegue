# =====================================================================
#  Sistema de Biblioteca - Configuración
# =====================================================================
spring.application.name=biblioteca
server.port=8080

# ---------- Secretos ----------
# Lee el archivo .env (NO versionado, esta en .gitignore) y le da PRIORIDAD
# sobre este archivo. Si no existe, la app arranca igual con los valores
# por defecto que se ven abajo.
spring.config.import=optional:file:.env[.properties]

# ---------- Base de datos (MySQL) ----------
# En Coolify/Docker: DB_URL=jdbc:mysql://<host-interno-de-mysql>:3306/biblioteca_orduna?...
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca_orduna?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:denis123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: crea/actualiza las tablas a partir de las entidades sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# En produccion: SHOW_SQL=false (imprimir cada consulta frena el servidor con muchos usuarios)
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Carga los autores y generos de varios libros en bloques de 100 (no una consulta por libro).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ---------- Script inicial (data.sql) ----------
# Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas.
# Usa INSERT IGNORE, así que se puede reiniciar la app sin duplicar datos.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# ---------- JSON ----------
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- JWT ----------
# Clave secreta para firmar los tokens (mínimo 32 caracteres). Cambiarla en producción.
# En produccion se pone JWT_SECRET (64+ caracteres al azar) en las variables de Coolify.
jwt.secret=${JWT_SECRET:BibliotecaOrduna-ClaveSecreta-JWT-2026-CambiarEnProduccion!}
# Duración del token: 8 horas (en milisegundos)
jwt.expiration-ms=28800000

# ---------- CORS ----------
# Orígenes del frontend permitidos, separados por coma (Angular, Vite/React, CRA, Live Server)
# Se puede sobrescribir con CORS_ALLOWED_ORIGINS en el .env (agregar el VPS).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500}

# ---------- Cloudflare R2 (almacenamiento de imagenes y PDFs) ----------
# Las claves reales viven en el .env, nunca en este archivo.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
# Bucket publico para las portadas de los libros
r2.bucket-portadas=${R2_BUCKET_PORTADAS:biblioteca}
# Bucket privado para los PDFs de los libros virtuales (se sirven con URL firmada)
r2.bucket-pdfs=${R2_BUCKET_PDFS:biblioteca-pdfs}
# URL publica del bucket de portadas
r2.url-publico-portadas=${R2_URL_PUBLICO_PORTADAS:}
# Dominio publico propio del bucket de portadas (opcional). Ej: portadas.mibiblioteca.pe
r2.dominio-publico=${R2_DOMINIO_PUBLICO:}

# ---------- Escaner de ISBN ----------
# Clave de Google Books (opcional y gratis: Google Cloud > APIs > Books API > Credenciales).
# Sin clave, Google comparte un cupo diario por IP y en un VPS suele responder 429.
isbn.google-api-key=${GOOGLE_BOOKS_API_KEY:}

# ---------- Direcciones de la aplicacion ----------
# En produccion: la direccion publica del frontend.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------- Produccion (Docker / Coolify) ----------
# El frontend compilado va dentro del jar (static/) y lo sirve FrontendConfig:
# se desactiva el mapeo estatico por defecto de Spring para que no haya dos.
spring.web.resources.add-mappings=false
# Detras del proxy de Coolify (Traefik): respeta X-Forwarded-Proto/Host (https).
server.forward-headers-strategy=framework
# Comprime JSON, JS y CSS: menos datos por usuario con 1000 clientes.
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/javascript,text/css,text/html,image/svg+xml
server.compression.min-response-size=1024

# ---------- Archivos (portadas y PDFs) ----------
# Tope de subida: el PDF de un libro virtual puede pesar hasta 50 MB.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

